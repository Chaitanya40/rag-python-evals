[project]
name = "kestrel-rag"
version = "0.1.0"
description = "A step-by-step RAG pipeline: chunking, local embeddings, SQLite + numpy retrieval, Claude generation and retrieval evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.6.0",
    "fastembed==0.8.0",
    "numpy==2.5.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
